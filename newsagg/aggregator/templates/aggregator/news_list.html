{% extends "base.html" %}
{% load static %}
{% block title %}Νέα Хедлайн - Лента{% endblock %}

{% block content %}

<div class="segmented-control-container">
  <div class="segmented-control">
    <a href="#" id="tab-actual" class="active">Актуальное</a>
    <a href="#" id="tab-lenta">Лента</a>
  </div>
</div>

<div class="tabs-content">

  <div id="content-actual" class="tab-pane active">

  <div class="news-feed"
       id="actual-feed"
       hx-get="{% url 'news_feed_actual' %}"
       hx-trigger="load, every 20s"
       hx-swap="innerHTML">

    {% include "aggregator/news_feed_actual.html" with actual_news=actual_news %}

  </div>

</div>

  <div id="content-lenta" class="tab-pane">
    <div id="lenta-panel">
      {% include "aggregator/news_lenta_panel.html" %}
    </div>
  </div>

</div>

<div class="modal fade" id="newsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
</div>

<script>
document.addEventListener("click", function (event) {
  const tagButton = event.target.closest("[data-tag-action]");
  const sourceButton = event.target.closest("[data-source-value]");

  if (!tagButton && !sourceButton) return;

  event.preventDefault();
  event.stopPropagation();

  const sourceInput = document.getElementById("source-filter-input");
  const tagsInput = document.getElementById("selected-tags-input");

  const currentTags = new Set(
    (tagsInput.value || "")
      .split(",")
      .map(t => t.trim())
      .filter(Boolean)
  );

  if (tagButton) {
    const tag = tagButton.dataset.tag;
    const action = tagButton.dataset.tagAction;

    if (action === "toggle") {
      if (currentTags.has(tag)) {
        currentTags.delete(tag);
      } else {
        currentTags.add(tag);
      }
    } else if (action === "remove") {
      currentTags.delete(tag);
    } else if (action === "clear") {
      currentTags.clear();
    }

    tagsInput.value = Array.from(currentTags).join(",");
  }

  if (sourceButton) {
    sourceInput.value = sourceButton.dataset.sourceValue;
  }

  htmx.ajax("GET", "{% url 'news_list' %}", {
    target: "#lenta-panel",
    swap: "innerHTML",
    values: {
      source: sourceInput.value || "all",
      tags: tagsInput.value || ""
    }
  });
});
</script>

{% endblock %}
